<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta
      name="description"
      content="OwnRAG — Your data. Your models. Your RAG. Self-hosted retrieval-augmented generation you fully own."
    />
    <title>OwnRAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so there is no flash of the wrong surface.
      (function () {
        try {
          var stored = localStorage.getItem('ownrag.theme');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.classList.toggle('dark', mode === 'dark');
          document.documentElement.dataset.theme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
